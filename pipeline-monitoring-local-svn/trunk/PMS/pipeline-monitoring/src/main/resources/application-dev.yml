#配置启动端口
server:
  port: 8204
  servlet:
    context-path: /pms

spring:
  application:
    name: PipelineMonitoringSystem
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  resource:
    static-locations: classpath:/static/,classpath:/public/

  #动态数据源
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          driver-class-name: org.postgresql.Driver
          url: jdbc:postgresql://10.0.15.28:5432/test_data
          username: postgres
          password: Data@2025

  cloud:
    nacos:
      discovery:
        server-addr: 10.0.15.26:8848
        name-space: fusionhubxv1
        group: http
        username: nacos
        password: nacos@hanwei#2025

  data:
    redis:
#      prefix: ai_   #各个业务系统得缓存key前缀，用于区分不同系统的缓存数据
      database: 10           # Redis服务器数据库
      host: 10.0.15.26    # Redis服务器地址
      port: 6379            # Redis服务器连接端口
      password: zhsw#2024      # Redis服务器连接密码（默认为空）
      timeout: 6000ms       # 连接超时时间（毫秒）
      jedis:
        pool:
          max-active: 200   # 连接池最大连接数（使用负值表示没有限制）
          max-wait: -1      # 连接池最大阻塞等待时间（使用负值表示没有限制）
          max-idle: 10      # 连接池中的最大空闲连接
          min-idle: 0       # 连接池中的最小空闲连接

mybatis-plus:
  mapper-locations: classpath*:com/hanwei/**/xml/*Mapper.xml
  global-config:
    # 关闭MP3.0自带的banner
    banner: false
    db-config:
      #主键类型  0:"数据库ID自增",1:"该类型为未设置主键类型", 2:"用户输入ID",3:"全局唯一ID (数字类型唯一ID)", 4:"全局唯一ID UUID",5:"字符串全局唯一ID (idWorker 的字符串表示)";
      id-type: ASSIGN_ID
      # 默认数据库表下划线命名
      table-underline: true
  configuration:
    # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 返回类型为Map,显示null对应的字段
    call-setters-on-nulls: true

# Dubbo服务配置
dubbo:
  application:
    name: PipelineMonitoringSystem
    check-serializable: false
    serialize-check-status: WARN
  reference:
    check: false
  protocol:
    name: dubbo
    port: 28103
  registry:
    address: nacos://10.0.15.26:8848
    parameters:
      namespace: fusionhubxv1
    group: dubbo
    username: nacos
    password: nacos@hanwei#2025
    register-mode: instance
#  cloud:
#    subscribed-services: fhx-authlink

swagger:
  enabled: true

excel:
  # 导入excel批处理数配置
  batchSaveCount: 100

autoApi:
  # 自动生成API配置，默认关闭 开启后启动时自动注册API到网关
  enable: false
  # 扫描的包路径，默认是当前项目路径下的com.hanwei包下所有类
  packageScanPath: com.hanwei
  # 网关地址
  gatewayAddress: 10.0.51.35
  # 网关端口
  gatewayPort: 9080
  # 注册环境 -Test 测试 -PRE 准生产环境 -RELEASE 生产环境
