#配置启动端口
server:
  port: 8101
  servlet:
    context-path: /test

spring:
  application:
    name: test-sample
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  resource:
    static-locations: classpath:/static/,classpath:/public/

  cloud:
    nacos:
      discovery:
        server-addr: 10.0.15.26:8848
        name-space:
        group: DEFAULT_GROUP
    sentinel:
      transport:
        # 添加sentinel的控制台地址
        dashboard: 10.0.15.26:8088
  data:
    redis:
      database: 10           # Redis服务器数据库
      host: 10.0.15.26    # Redis服务器地址
      port: 6379            # Redis服务器连接端口
      password: zhsw#2024      # Redis服务器连接密码（默认为空）
      timeout: 6000ms       # 连接超时时间（毫秒）
      jedis:
        pool:
          max-active: 200   # 连接池最大连接数（使用负值表示没有限制）
          max-wait: -1      # 连接池最大阻塞等待时间（使用负值表示没有限制）
          max-idle: 10      # 连接池中的最大空闲连接
          min-idle: 0       # 连接池中的最小空闲连接


# Dubbo服务配置
dubbo:
  application:
    name: test-sample
    check-serializable: false
    serialize-check-status: WARN
  reference:
    check: false
  protocol:
    name: dubbo
    port: 28103
  registry:
    address: nacos://10.0.15.26:8848
    parameters:
      namespace: fusionhubxv1
    group: dubbo
    register-mode: instance
#  cloud:
#    subscribed-services: fhx-authlink

autoApi:
  # 自动生成API配置，默认关闭 开启后启动时自动注册API到网关
  enable: false
  # 扫描的包路径，默认是当前项目路径下的com.hanwei包下所有类
  packageScanPath: com.hanwei
  # 网关地址
  gatewayAddress: 10.0.51.35
  # 网关端口
  gatewayPort: 9080
  # 注册环境 -Test 测试 -PRE 准生产环境 -RELEASE 生产环境
  env: -Test
